# Fly.io app configuration for the Shelter Volunteer website.
# Generated for manual deploy; app name must be globally unique on Fly.io.
app = "shelter-volunteer"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
