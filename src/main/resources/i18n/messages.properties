footer.text=Pro Anima Volunteer Hub

home.title=Pro Anima Volunteer Hub
home.hero.lead=We help the cats of the Pro Anima shelter in Belgrade: we look after them, play with them and find them families.
home.hero.cta.join=How to join
home.hero.cta.cats=Cats looking for a home
home.hero.photo.alt=Volunteers having tea in a gazebo

home.about.title=About the shelter
home.about.text=Pro Anima is a shelter for cats and dogs in Belgrade. It was founded in 2010 and is now home to more than 40 cats and about 60 dogs. This website is for the people who help the cats.
home.about.quote=Do something good, do something for your soul, so that you feel good. You'll have a feeling that's much more valuable than what money can bring you.
home.about.quote.author=Mirica Toma, founder of the Pro Anima shelter
home.about.instagram=Follow the shelter on Instagram:

home.volunteers.title=What volunteers do
home.volunteers.intro=Volunteers come to the shelter and help with everyday tasks:
home.volunteers.item.cleaning=cleaning the enclosures: cleaning litter trays, sweeping and washing the floors;
home.volunteers.item.feeding=feeding the cats, washing the bowls and changing the water;
home.volunteers.item.socialization=spending time with the cats: petting them, playing and helping them get used to people.
home.volunteers.more=More details on what to do in the enclosures are in the guide:

home.join.title=How to join
home.join.intro=There are no restrictions for new volunteers. To get started:
home.join.step1=Read the short guide: it explains what to bring and how to behave at the shelter.
home.join.step1.link=Open the guide
home.join.step2=Message a coordinator on Telegram to get into the cat volunteer chat:
home.join.step3=Pick a visit in the chat: it has the current schedule and signup.
home.join.schedule=Visits take place on Wednesdays and Saturdays and last about three hours. We leave from Vračar (Belgrade): at 9:00 on Wednesdays and at 10:00 on Saturdays.
home.join.places=The number of places on each visit is limited by the size of the transfer. Keep an eye on the current schedule in the chat.
home.join.photo.alt=Volunteers by a blooming lilac

home.nextVisit.title=Next visit
home.nextVisit.empty=Check the cat volunteer chat for the current visit schedule.

home.cats.title=Cats looking for a home
home.cats.intro=These cats are waiting for their family.

home.help.title=Other ways to help
home.help.intro=You can help in more ways than visits. The shelter needs:
home.help.item.donations=donations;
home.help.item.food=food;
home.help.item.catThings=things for cats: beds, toys, blankets;
home.help.item.supplies=useful things for the shelter: rubber gloves, sponges, cleaning rags;
home.help.item.foster=fostering: a temporary home for a cat while it looks for a family.
home.help.contact=For anything, message the coordinators:

home.contact.nata=Natalia
home.contact.alina=Alina
home.contact.or=or
