home.title=Pro Anima Volunteer Hub
home.hero.lead=Volunteers come to the shelter to help with everyday tasks. The trips are organized by the volunteer group Svora.Volunteers; there are no restrictions for new volunteers.
home.hero.photo.alt=Volunteers having tea in a gazebo
home.hero.headline=Help at the Pro Anima shelter in Belgrade

home.about.title=About the shelter
home.about.text=Pro Anima is a shelter for cats and dogs in Belgrade. It was founded in 2010 and is now home to more than 40 cats and about 60 dogs.
home.about.quote=Do something good, do something for your soul, so that you feel good. You'll have a feeling that's much more valuable than what money can bring you.
home.about.quote.author=Mirica Toma, founder of the Pro Anima shelter

home.volunteers.title=How volunteers help
home.volunteers.cats.title=With the cats
home.volunteers.cleaning.text=Cleaning litter trays, sweeping and washing the floors in the enclosures.
home.volunteers.feeding.text=Feeding the cats, washing the bowls and changing the water.
home.volunteers.socialization.text=Petting them, playing and helping them get used to people.
home.volunteers.dogs.title=With the dogs
home.volunteers.dogs.walking=Walking the dogs.
home.volunteers.dogs.cleaning=Cleaning the enclosures.
home.volunteers.dogs.socialization=Spending time with them and helping them socialize.

