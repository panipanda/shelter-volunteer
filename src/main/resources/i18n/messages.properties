home.page.description=Volunteers help the cats and dogs of the Pro Anima shelter in Belgrade. How to join, the volunteer guide, cats looking for a home and the volunteer group Svora.Volunteers.
home.volunteers.dogs=About working with the dogs
home.join.dogs=Want to help the dogs? Message Dasha to get into the Svora.Volunteers chat:
home.dogs.title=Dogs
home.dogs.text=About 60 dogs live at the shelter. As with the cats, the trips to them are organized by Svora.Volunteers. A separate page explains how to get to the dogs and how to help them.
home.dogs.cta.page=About the dogs and how to help
dogs.page.title=Dogs — Svora.Volunteers
dogs.page.description=The dogs of the Pro Anima shelter and the Svora.Volunteers group, which organizes trips to the shelter and helps with food, donations and events.
dogs.intro=Trips to the dogs, like all trips to the shelter, are organized by the volunteer group Svora.Volunteers. Here is who they are and how to get on a trip.
dogs.shelter=About 60 dogs live at the shelter. They are all vaccinated and not aggressive, and live in enclosures; leashes for walks are handed out on site.
