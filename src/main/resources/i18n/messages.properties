home.about.title=About the shelter
home.about.text=Pro Anima is a shelter for cats and dogs in Belgrade. It was founded in 2010 and is now home to more than 40 cats and about 60 dogs. The shelter is helped by the volunteer group Svora.Volunteers. This website is for those who want to visit the shelter and help.
home.about.quote=Do something good, do something for your soul, so that you feel good. You'll have a feeling that's much more valuable than what money can bring you.
home.about.quote.author=Mirica Toma, founder of the Pro Anima shelter
home.about.instagram=Follow the shelter on Instagram:
home.about.telegram=News and announcements are in the shelter's Telegram channel:
home.about.svora=The Svora.Volunteers group on Instagram:

home.volunteers.title=What volunteers do
home.volunteers.intro=Volunteers come to the shelter and help with everyday tasks. With the cats that means:
home.volunteers.cleaning.title=Cleaning the enclosures
home.volunteers.cleaning.text=Cleaning litter trays, sweeping and washing the floors.
home.volunteers.feeding.title=Feeding
home.volunteers.feeding.text=Feeding the cats, washing the bowls and changing the water.
home.volunteers.socialization.title=Time with the cats
home.volunteers.socialization.text=Petting them, playing and helping them get used to people.
home.volunteers.more=More details on what to do are in the guide:

home.join.title=How to join
home.join.intro=There are no restrictions for new volunteers. Trips to the shelter are organized by Svora.Volunteers. To get started:
home.join.step1=Read the short guide: it explains what to bring and how to behave at the shelter.
home.join.step1.link=Open the guide
home.join.step2=Message a coordinator on Telegram to get into the cat volunteer chat:
home.join.step3=Pick a visit in the chat: it has the current schedule and signup.
home.join.schedule=Visits take place on Wednesdays and Saturdays and last about three hours. We leave from Vračar (Belgrade): at 9:00 on Wednesdays and at 10:00 on Saturdays.
home.join.places=The number of places on each visit is limited by the size of the transfer. Keep an eye on the current schedule in the chat.
home.join.photo.alt=Volunteers by a blooming lilac

