home.volunteers.title=Čime se bave volonteri
home.volunteers.intro=Volonteri dolaze u azil i pomažu oko svakodnevnih poslova. Kod mačaka to znači:
home.volunteers.cleaning.title=Čišćenje boksova
home.volunteers.cleaning.text=Čiste kutije za pesak, čiste i peru podove.
home.volunteers.feeding.title=Hranjenje
home.volunteers.feeding.text=Hrane mačke, peru posude i menjaju vodu.
home.volunteers.socialization.title=Druženje s mačkama
home.volunteers.socialization.text=Maze ih, igraju se i pomažu im da se naviknu na ljude.
home.volunteers.more=Detalji o tome šta i kako raditi nalaze se u vodiču:

home.join.title=Kako se pridružiti
home.join.intro=Za nove volontere nema ograničenja. Posete azilu organizuje Svora.Volunteers. Da biste počeli:
home.join.step1=Pročitajte kratak vodič: u njemu piše šta poneti i kako se ponašati u azilu.
home.join.step1.link=Otvori vodič
home.join.step2=Pišite koordinatoru na Telegramu da biste ušli u čet volontera za mačke:
home.join.step3=Izaberite posetu u četu: tamo su aktuelni raspored i prijava.
home.join.schedule=Posete se održavaju sredom i subotom i traju oko tri sata. Polazak je sa Vračara (Beograd): sredom u 9:00, subotom u 10:00.
home.join.places=Broj mesta na svakoj poseti ograničen je veličinom prevoza. Pratite aktuelni raspored u četu.
