home.about.title=O azilu
home.about.text=Pro Anima je azil za mačke i pse u Beogradu. Osnovan je 2010. godine, a danas u njemu živi više od 40 mačaka i oko 60 pasa. Azilu pomaže volonterska grupa Svora.Volunteers. Ovaj sajt je za one koji žele da dođu u azil i pomognu.
home.about.quote=Uradite nešto dobro, uradite nešto za svoju dušu, da biste se osećali dobro. Taj osećaj je mnogo vredniji od svega što vam novac može doneti.
home.about.quote.author=Mirica Toma, osnivačica azila Pro Anima
home.about.instagram=Pratite azil na Instagramu:
home.about.telegram=Vesti i obaveštenja azila su na Telegram kanalu:
