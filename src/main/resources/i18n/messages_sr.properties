home.join.schedule=Posete se održavaju sredom i subotom i traju oko tri sata. Polazak je sa Vračara (Beograd): sredom u 9:00, subotom u 10:00.
home.join.places=Broj mesta na svakoj poseti ograničen je veličinom prevoza. Pratite aktuelni raspored u četu.
