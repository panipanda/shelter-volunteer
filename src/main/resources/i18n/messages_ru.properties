home.about.title=О приюте
home.about.text=Pro Anima — приют для кошек и собак в Белграде. Он основан в 2010 году, сейчас в нём живут более 40 кошек и около 60 собак. Приюту помогает волонтёрская группа Svora.Volunteers. Этот сайт — для тех, кто хочет приехать в приют и помочь.
home.about.quote=Сделайте что-нибудь хорошее, сделайте что-нибудь для своей души, чтобы вам стало хорошо. Это чувство гораздо ценнее всего, что могут вам дать деньги.
home.about.quote.author=Мирица Тома, основательница приюта Pro Anima
home.about.instagram=Следите за жизнью приюта в Instagram:
home.about.telegram=Новости и объявления приюта — в Telegram-канале:
home.about.svora=Волонтёрская группа Svora.Volunteers в Instagram:

home.volunteers.title=Чем занимаются волонтёры
home.volunteers.intro=Волонтёры приезжают в приют и помогают с повседневными делами. С кошками это:
home.volunteers.cleaning.title=Уборка вольеров
home.volunteers.cleaning.text=Чистят лотки, подметают и моют полы.
home.volunteers.feeding.title=Кормление
home.volunteers.feeding.text=Кормят кошек, моют миски и меняют воду.
home.volunteers.socialization.title=Общение с кошками
home.volunteers.socialization.text=Гладят, играют, помогают привыкнуть к людям.
home.volunteers.more=Подробности о том, что и как делать, — в гайде:

home.join.title=Как присоединиться
home.join.intro=Ограничений для новых волонтёров нет. Выезды в приют организует Svora.Volunteers. Чтобы начать:
home.join.step1=Прочитайте короткий гайд: в нём написано, что взять с собой и как вести себя в приюте.
home.join.step1.link=Открыть гайд
home.join.step2=Напишите координатору в Telegram, чтобы попасть в чат котоволонтёров:
home.join.step3=Выберите визит в чате: там актуальное расписание и запись.
home.join.schedule=Визиты проходят по средам и субботам и длятся около трёх часов. Выезд из Врачара (Белград): в среду в 9:00, в субботу в 10:00.
home.join.places=Мест на каждый визит ограниченное количество: оно зависит от размера трансфера. Следите за актуальным расписанием в чате.
home.join.photo.alt=Волонтёры у цветущей сирени

home.nextVisit.title=Ближайший визит
home.nextVisit.departure=Выезд из Врачара (Белград) в {0}.
home.nextVisit.chat=Запись и свободные места — в чате котоволонтёров. Если есть вопросы, пишите координаторам.
home.nextVisit.cta=Записаться в чате

