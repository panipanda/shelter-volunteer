home.title=Волонтёрский центр Pro Anima
home.hero.lead=Мы помогаем кошкам белградского приюта Pro Anima: ухаживаем за ними, играем с ними и ищем им семьи.
home.hero.cta.join=Как присоединиться
home.hero.cta.cats=Кошки в поиске дома
home.hero.photo.alt=Волонтёры за чаем в беседке

home.about.title=О приюте
home.about.text=Pro Anima — приют для кошек и собак в Белграде. Он основан в 2010 году, сейчас в нём живут более 40 кошек и около 60 собак. Этот сайт — для тех, кто помогает кошкам.
home.about.quote=Сделайте что-нибудь хорошее, сделайте что-нибудь для своей души, чтобы вам стало хорошо. Это чувство гораздо ценнее всего, что могут вам дать деньги.
home.about.quote.author=Мирица Тома, основательница приюта Pro Anima
home.about.instagram=Следите за жизнью приюта в Instagram:

home.volunteers.title=Чем занимаются волонтёры
home.volunteers.intro=Волонтёры приезжают в приют и помогают с повседневными делами:
home.volunteers.item.cleaning=убирают вольеры: чистят лотки, подметают и моют полы;
home.volunteers.item.feeding=кормят кошек, моют миски и меняют воду;
home.volunteers.item.socialization=общаются с кошками: гладят, играют, помогают им привыкать к людям.
home.volunteers.more=Подробности о том, что и как делать в вольерах, — в гайде:

home.join.title=Как присоединиться
home.join.intro=Ограничений для новых волонтёров нет. Чтобы начать:
home.join.step1=Прочитайте короткий гайд: в нём написано, что взять с собой и как вести себя в приюте.
home.join.step1.link=Открыть гайд
home.join.step2=Напишите координатору в Telegram, чтобы попасть в чат котоволонтёров:
home.join.step3=Выберите визит в чате: там актуальное расписание и запись.
home.join.schedule=Визиты проходят по средам и субботам и длятся около трёх часов. Выезд из Врачара (Белград): в среду в 9:00, в субботу в 10:00.
home.join.places=Мест на каждый визит ограниченное количество: оно зависит от размера трансфера. Следите за актуальным расписанием в чате.
home.join.photo.alt=Волонтёры у цветущей сирени

home.nextVisit.title=Ближайший визит
home.nextVisit.empty=Актуальное расписание визитов смотрите в чате котоволонтёров.

home.cats.title=Кошки в поиске дома
home.cats.intro=Эти кошки ждут свою семью.

home.help.title=Как ещё помочь
home.help.intro=Помочь можно не только визитами. Приюту нужны:
home.help.item.donations=пожертвования;
home.help.item.food=корм;
home.help.item.catThings=вещи для кошек: лежанки, игрушки, пледы;
home.help.item.supplies=полезные вещи для приюта: резиновые перчатки, губки, тряпки для уборки;
home.help.item.foster=передержка: временный дом для кошки, пока она ищет семью.
home.help.contact=По всем вопросам пишите координаторам:

home.contact.nata=Наталья
home.contact.alina=Алина
home.contact.or=или
