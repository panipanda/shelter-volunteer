dogs.page.title=Собаки — Svora.Volunteers
dogs.page.description=Собаки приюта Pro Anima и волонтёрская группа Svora.Volunteers, которая организует выезды в приют, помогает с кормом, донатами и мероприятиями.
dogs.intro=Выезды к собакам организует волонтёрская группа Svora.Volunteers. Здесь собрано, кто они и как попасть на выезд.
dogs.shelter=В приюте живут около 60 собак. Все они привиты и неагрессивны и живут в вольерах; поводки для выгула выдают на месте.
