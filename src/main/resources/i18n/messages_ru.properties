home.dogs.title=Собаки и Svora.Volunteers
home.dogs.text=В приюте живут около 60 собак. Им помогает волонтёрская группа Svora.Volunteers: организует выезды в приют, помогает закупать корм и всё необходимое, собирает донаты и проводит мероприятия в пользу приюта.
