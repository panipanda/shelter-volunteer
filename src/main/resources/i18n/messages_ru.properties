dogs.page.title=Собаки — Svora.Volunteers
dogs.page.description=Собакам приюта Pro Anima помогает волонтёрская группа Svora.Volunteers: выезды в приют, корм, донаты и мероприятия.
dogs.intro=Собакам приюта Pro Anima помогает волонтёрская группа Svora.Volunteers. Здесь собрано, кто они и как к ним присоединиться.
dogs.shelter=В приюте живут около 60 собак. Все они привиты и неагрессивны и живут в вольерах; поводки для выгула выдают на месте.
